# yaml-language-server: $schema=../schemas/orchestration.schema.json
name: hello
description: >
  Starter orchestration scaffolded by `orchestra init`. A three-step DAG that
  researches a topic, writes a short brief from those findings, then assembles a
  final Markdown document. Runs with no arguments, and takes an optional
  --param topic=... to point it at something else.
version: "1.0.0"
defaultModel: claude-opus-4.8

# Typed inputs. `required: false` plus a `default` is what lets this run bare:
#   orchestra run hello
#   orchestra run hello --param topic="vector databases"
inputs:
  topic:
    type: string
    description: The subject to research and brief.
    required: false
    default: deterministic AI agent orchestration

steps:
  # Step 1 has no dependencies, so it runs first.
  - name: research
    type: Prompt
    systemPrompt: You are a meticulous research assistant. Be specific and concrete.
    userPrompt: |
      Research "{{param.topic}}" and list the three most important findings
      as concise bullet points. No preamble, just the bullets.

  # `dependsOn` is what builds the DAG. {{research.output}} injects the previous
  # step's result into this prompt — steps communicate through these references.
  - name: brief
    type: Prompt
    dependsOn: [research]
    systemPrompt: You are a technical writer who values clarity over length.
    userPrompt: |
      Using the findings below, write a 120-word executive brief on
      "{{param.topic}}". Plain prose, no headings, no bullets.

      {{research.output}}

  # Not every step needs an agent. Transform renders a template string using the
  # same expressions — pure string shaping, no model call, no cost.
  - name: document
    type: Transform
    dependsOn: [brief]
    template: |
      # {{param.topic}}

      {{brief.output}}

      ## Findings

      {{research.output}}

      ---
      Generated by {{orchestration.name}} · run {{orchestration.runId}}
